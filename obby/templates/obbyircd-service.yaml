{{- if .Values.obbyircd.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obby.fullname" . }}-obbyircd
  labels:
    {{- include "obby.componentLabels" (dict "component" "obbyircd" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 4 }}
spec:
  type: {{ .Values.obbyircd.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: obbyircd
  ports:
    - name: ssl
      port: {{ .Values.obbyircd.service.sslPort }}
      targetPort: ssl
    - name: ws
      port: {{ .Values.obbyircd.service.wsPort }}
      targetPort: ws
{{- end }}
