{{- if .Values.obbyApi.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obby.fullname" . }}-obby-api
  labels:
    {{- include "obby.componentLabels" (dict "component" "obby-api" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 4 }}
spec:
  replicas: {{ .Values.obbyApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: obby-api
  template:
    metadata:
      labels:
        {{- include "obby.componentLabels" (dict "component" "obby-api" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 8 }}
      {{- with .Values.obbyApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: obby-api
          image: "{{ .Values.obbyApi.image.repository }}:{{ default .Chart.AppVersion .Values.obbyApi.image.tag }}"
          imagePullPolicy: {{ .Values.obbyApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: turn
              containerPort: {{ .Values.obbyApi.turnPort }}
              protocol: UDP
          env:
            - name: PORT
              value: "8080"
            - name: VOICE_BRIDGE_SOCKET
              value: /run/obbyirc/voice.sock
            - name: VOICE_TURN_PORT
              value: {{ .Values.obbyApi.turnPort | quote }}
            - name: VOICE_TURN_REALM
              value: {{ .Values.obbyApi.turnRealm | quote }}
            - name: VOICE_PUBLIC_IP
              value: {{ .Values.obbyApi.voicePublicIp | quote }}
            - name: VOICE_MAX_ROOM
              value: {{ .Values.obbyApi.voiceMaxRoom | quote }}
            - name: UNREALIRCD_WS_URL
              value: "ws://{{ include "obby.fullname" . }}-obbyircd:{{ .Values.obbyircd.service.wsPort }}"
            - name: UNREALIRCD_API_USERNAME
              value: "admin"
            - name: FILEHOST_PUBLIC_URL
              value: {{ .Values.obbyApi.filehostPublicUrl | quote }}
            {{- if .Values.obbyircd.voiceTurn.external.urls }}
            - name: VOICE_TURN_DISABLE_EMBEDDED
              value: "1"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "obby.fullname" . }}-obby-api
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: images
              mountPath: /app/images
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.obbyApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "obby.fullname" . }}-obby-api-data
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "obby.fullname" . }}-obby-api-images
      {{- with .Values.obbyApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.obbyApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.obbyApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
